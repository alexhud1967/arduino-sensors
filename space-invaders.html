<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Invaders Clone</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        
        canvas {
            border: 1px solid #333;
            background: #000;
        }
        
        .game-info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="game-info">
        <div>Score: <span id="score">0</span></div>
        <div>Lives: <span id="lives">3</span></div>
        <div>Extra Cannons: <span id="cannons">0</span></div>
    </div>
    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <script>
        // Game setup
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // Game state
        let score = 0;
        let lives = 3;
        let gameRunning = true;
        
        // Mouse position
        let mouseX = canvas.width / 2;
        
        // Stars for background
        const stars = [];
        const numStars = 100;
        
        // Initialize stars
        for (let i = 0; i < numStars; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                speed: Math.random() * 2 + 0.5,
                brightness: Math.random() * 0.8 + 0.2
            });
        }
        
        // Player ship
        const player = {
            x: canvas.width / 2,
            y: canvas.height - 50,
            width: 20,
            height: 20,
            speed: 5
        };
        
        // Bullets
        const bullets = [];
        const bulletSpeed = 7;
        let lastBulletTime = 0;
        const bulletInterval = 150; // milliseconds between bullets
        
        // Enemies
        const enemies = [];
        const enemyBullets = [];
        const enemyBulletSpeed = 3;
        let lastEnemyShootTime = 0;
        const enemyShootInterval = 2000; // milliseconds between enemy shots
        
        // Enemy types
        const enemyTypes = [
            { color: '#ff0000', width: 25, height: 15, health: 1, points: 10, shootChance: 0.3 }, // Red basic
            { color: '#ff8800', width: 30, height: 18, health: 2, points: 20, shootChance: 0.4 }, // Orange medium
            { color: '#ffff00', width: 20, height: 12, health: 1, points: 15, shootChance: 0.5 }, // Yellow fast
            { color: '#8800ff', width: 35, height: 22, health: 3, points: 30, shootChance: 0.2 }, // Purple heavy
            { color: '#00ff88', width: 28, height: 16, health: 1, points: 25, shootChance: 0.6 }  // Green sniper
        ];
        
        // Juggernaut
        let juggernaut = null;
        const juggernauts = [];
        
        // Powerups
        const powerups = [];
        let lastPowerupTime = 0;
        const powerupInterval = 15000; // 15 seconds between powerups
        
        // Player cannons
        let extraCannons = 0;
        
        // Initialize enemies
        function createEnemies() {
            enemies.length = 0;
            enemyBullets.length = 0;
            
            // Create random enemies
            for (let i = 0; i < 15; i++) {
                const type = enemyTypes[Math.floor(Math.random() * enemyTypes.length)];
                enemies.push({
                    x: Math.random() * (canvas.width - type.width),
                    y: Math.random() * 200 + 50,
                    width: type.width,
                    height: type.height,
                    color: type.color,
                    health: type.health,
                    maxHealth: type.health,
                    points: type.points,
                    shootChance: type.shootChance,
                    alive: true,
                    speedX: (Math.random() - 0.5) * 2,
                    speedY: Math.random() * 0.5 + 0.2,
                    lastShot: 0
                });
            }
            
            // Always spawn a juggernaut
            createJuggernaut();
        }
        
        // Create juggernaut with 5 concentric rings
        function createJuggernaut() {
            juggernaut = {
                x: canvas.width / 2 - 50,
                y: 30,
                baseWidth: 100,
                baseHeight: 80,
                rings: 5, // 5 concentric rings
                maxRings: 5,
                alive: true,
                speedX: 1,
                speedY: 0.3,
                lastShot: 0,
                shakeX: 0,
                shakeY: 0,
                colors: ['#ff0066', '#ff3388', '#ff66aa', '#ff99cc', '#ffccee']
            };
        }
        
        // Create powerup
        function createPowerup() {
            const types = [
                { type: 'life', color: '#00ff00', symbol: '♥' },
                { type: 'cannon', color: '#ffff00', symbol: '⚡' }
            ];
            const type = types[Math.floor(Math.random() * types.length)];
            
            powerups.push({
                x: Math.random() * (canvas.width - 30),
                y: -30,
                width: 30,
                height: 30,
                type: type.type,
                color: type.color,
                symbol: type.symbol,
                speedY: 2,
                alive: true
            });
        }
        
        // Mouse movement
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            mouseX = e.clientX - rect.left;
        });
        
        // Draw triangle ship
        function drawPlayer() {
            ctx.fillStyle = '#00ff00';
            ctx.beginPath();
            ctx.moveTo(player.x, player.y - player.height / 2);
            ctx.lineTo(player.x - player.width / 2, player.y + player.height / 2);
            ctx.lineTo(player.x + player.width / 2, player.y + player.height / 2);
            ctx.closePath();
            ctx.fill();
        }
        
        // Draw stars (larger with black outline)
        function drawStars() {
            stars.forEach(star => {
                ctx.globalAlpha = star.brightness;
                
                // Black outline
                ctx.fillStyle = 'black';
                ctx.fillRect(star.x - 1, star.y - 1, 4, 4);
                
                // White star
                ctx.fillStyle = 'white';
                ctx.fillRect(star.x, star.y, 2, 2);
            });
            ctx.globalAlpha = 1;
        }
        
        // Update stars
        function updateStars() {
            stars.forEach(star => {
                star.y += star.speed;
                if (star.y > canvas.height) {
                    star.y = 0;
                    star.x = Math.random() * canvas.width;
                }
            });
        }
        
        // Draw bullets (larger with black outline)
        function drawBullets() {
            bullets.forEach(bullet => {
                // Black outline
                ctx.fillStyle = 'black';
                ctx.fillRect(bullet.x - 3, bullet.y - 8, 6, 16);
                
                // Yellow bullet
                ctx.fillStyle = '#ffff00';
                ctx.fillRect(bullet.x - 2, bullet.y - 7, 4, 14);
            });
        }
        
        // Update bullets
        function updateBullets() {
            for (let i = bullets.length - 1; i >= 0; i--) {
                bullets[i].y -= bulletSpeed;
                if (bullets[i].y < 0) {
                    bullets.splice(i, 1);
                }
            }
        }
        
        // Create bullet(s) - multiple if extra cannons
        function createBullet() {
            // Main cannon
            bullets.push({
                x: player.x,
                y: player.y - player.height / 2
            });
            
            // Extra cannons
            for (let i = 0; i < extraCannons; i++) {
                bullets.push({
                    x: player.x + (i + 1) * 15 * (i % 2 === 0 ? 1 : -1),
                    y: player.y - player.height / 2
                });
            }
        }
        
        // Draw enemies (with black outlines)
        function drawEnemies() {
            enemies.forEach(enemy => {
                if (enemy.alive) {
                    // Vary opacity based on health
                    const healthRatio = enemy.health / enemy.maxHealth;
                    ctx.globalAlpha = 0.3 + (healthRatio * 0.7);
                    
                    // Draw different shapes based on color with black outlines
                    if (enemy.color === '#ffff00') { // Yellow - diamond
                        // Black outline
                        ctx.fillStyle = 'black';
                        ctx.beginPath();
                        ctx.moveTo(enemy.x + enemy.width/2, enemy.y - 2);
                        ctx.lineTo(enemy.x + enemy.width + 2, enemy.y + enemy.height/2);
                        ctx.lineTo(enemy.x + enemy.width/2, enemy.y + enemy.height + 2);
                        ctx.lineTo(enemy.x - 2, enemy.y + enemy.height/2);
                        ctx.closePath();
                        ctx.fill();
                        
                        // Yellow diamond
                        ctx.fillStyle = enemy.color;
                        ctx.beginPath();
                        ctx.moveTo(enemy.x + enemy.width/2, enemy.y);
                        ctx.lineTo(enemy.x + enemy.width, enemy.y + enemy.height/2);
                        ctx.lineTo(enemy.x + enemy.width/2, enemy.y + enemy.height);
                        ctx.lineTo(enemy.x, enemy.y + enemy.height/2);
                        ctx.closePath();
                        ctx.fill();
                    } else if (enemy.color === '#00ff88') { // Green - circle
                        // Black outline
                        ctx.fillStyle = 'black';
                        ctx.beginPath();
                        ctx.arc(enemy.x + enemy.width/2, enemy.y + enemy.height/2, enemy.width/2 + 2, 0, Math.PI * 2);
                        ctx.fill();
                        
                        // Green circle
                        ctx.fillStyle = enemy.color;
                        ctx.beginPath();
                        ctx.arc(enemy.x + enemy.width/2, enemy.y + enemy.height/2, enemy.width/2, 0, Math.PI * 2);
                        ctx.fill();
                    } else if (enemy.color === '#8800ff') { // Purple - triangle
                        // Black outline
                        ctx.fillStyle = 'black';
                        ctx.beginPath();
                        ctx.moveTo(enemy.x + enemy.width/2, enemy.y - 2);
                        ctx.lineTo(enemy.x - 2, enemy.y + enemy.height + 2);
                        ctx.lineTo(enemy.x + enemy.width + 2, enemy.y + enemy.height + 2);
                        ctx.closePath();
                        ctx.fill();
                        
                        // Purple triangle
                        ctx.fillStyle = enemy.color;
                        ctx.beginPath();
                        ctx.moveTo(enemy.x + enemy.width/2, enemy.y);
                        ctx.lineTo(enemy.x, enemy.y + enemy.height);
                        ctx.lineTo(enemy.x + enemy.width, enemy.y + enemy.height);
                        ctx.closePath();
                        ctx.fill();
                    } else { // Rectangle for others
                        // Black outline
                        ctx.fillStyle = 'black';
                        ctx.fillRect(enemy.x - 2, enemy.y - 2, enemy.width + 4, enemy.height + 4);
                        
                        // Colored rectangle
                        ctx.fillStyle = enemy.color;
                        ctx.fillRect(enemy.x, enemy.y, enemy.width, enemy.height);
                    }
                }
            });
            ctx.globalAlpha = 1;
        }
        
        // Draw juggernaut with concentric rings
        function drawJuggernaut() {
            if (juggernaut && juggernaut.alive) {
                // Calculate shake based on damage
                const damageRatio = 1 - (juggernaut.rings / juggernaut.maxRings);
                const shakeIntensity = damageRatio * 8;
                juggernaut.shakeX = (Math.random() - 0.5) * shakeIntensity;
                juggernaut.shakeY = (Math.random() - 0.5) * shakeIntensity;
                
                // Size increases as rings are destroyed
                const sizeMultiplier = 1 + damageRatio * 0.8;
                const centerX = juggernaut.x + juggernaut.baseWidth / 2 + juggernaut.shakeX;
                const centerY = juggernaut.y + juggernaut.baseHeight / 2 + juggernaut.shakeY;
                
                // Draw concentric rings from outside to inside
                for (let ring = juggernaut.rings - 1; ring >= 0; ring--) {
                    const ringSize = (ring + 1) * 15 * sizeMultiplier;
                    const color = juggernaut.colors[ring];
                    
                    // Black outline
                    ctx.fillStyle = 'black';
                    ctx.fillRect(centerX - ringSize/2 - 3, centerY - ringSize/2 - 3, ringSize + 6, ringSize + 6);
                    
                    // Colored ring
                    ctx.fillStyle = color;
                    ctx.fillRect(centerX - ringSize/2, centerY - ringSize/2, ringSize, ringSize);
                }
                
                // Draw ring counter
                ctx.fillStyle = '#ffffff';
                ctx.font = '16px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(`Rings: ${juggernaut.rings}`, centerX, juggernaut.y - 20);
            }
        }
        
        // Draw enemy bullets (larger with black outline)
        function drawEnemyBullets() {
            enemyBullets.forEach(bullet => {
                // Black outline
                ctx.fillStyle = 'black';
                ctx.fillRect(bullet.x - 3, bullet.y - 5, 6, 10);
                
                // Red bullet
                ctx.fillStyle = '#ff4444';
                ctx.fillRect(bullet.x - 2, bullet.y - 4, 4, 8);
            });
        }
        
        // Draw powerups
        function drawPowerups() {
            powerups.forEach(powerup => {
                if (powerup.alive) {
                    // Black outline
                    ctx.fillStyle = 'black';
                    ctx.fillRect(powerup.x - 2, powerup.y - 2, powerup.width + 4, powerup.height + 4);
                    
                    // Powerup background
                    ctx.fillStyle = powerup.color;
                    ctx.fillRect(powerup.x, powerup.y, powerup.width, powerup.height);
                    
                    // Symbol
                    ctx.fillStyle = 'black';
                    ctx.font = '20px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText(powerup.symbol, powerup.x + powerup.width/2, powerup.y + powerup.height/2 + 7);
                }
            });
        }
        
        // Update enemies
        function updateEnemies() {
            const currentTime = Date.now();
            
            enemies.forEach(enemy => {
                if (enemy.alive) {
                    // Independent movement
                    enemy.x += enemy.speedX;
                    enemy.y += enemy.speedY;
                    
                    // Bounce off walls
                    if (enemy.x <= 0 || enemy.x + enemy.width >= canvas.width) {
                        enemy.speedX *= -1;
                    }
                    
                    // Wrap around vertically (come from top when they go off bottom)
                    if (enemy.y > canvas.height) {
                        enemy.y = -enemy.height;
                        enemy.x = Math.random() * (canvas.width - enemy.width);
                    }
                    
                    // Enemy shooting
                    if (currentTime - enemy.lastShot > 3000 && Math.random() < enemy.shootChance * 0.01) {
                        enemyBullets.push({
                            x: enemy.x + enemy.width / 2,
                            y: enemy.y + enemy.height,
                            speedX: 0,
                            speedY: enemyBulletSpeed
                        });
                        enemy.lastShot = currentTime;
                    }
                }
            });
            
            // Update juggernaut
            if (juggernaut && juggernaut.alive) {
                juggernaut.x += juggernaut.speedX;
                juggernaut.y += juggernaut.speedY;
                
                // Bounce off walls
                if (juggernaut.x <= 0 || juggernaut.x + juggernaut.baseWidth >= canvas.width) {
                    juggernaut.speedX *= -1;
                }
                
                // Keep in upper area
                if (juggernaut.y > 150) {
                    juggernaut.speedY = -Math.abs(juggernaut.speedY);
                }
                if (juggernaut.y < 20) {
                    juggernaut.speedY = Math.abs(juggernaut.speedY);
                }
                
                // Juggernaut shooting (more bullets as rings are destroyed)
                if (currentTime - juggernaut.lastShot > 1500) {
                    const bulletCount = 6 - juggernaut.rings; // More bullets with fewer rings
                    for (let i = 0; i < bulletCount; i++) {
                        enemyBullets.push({
                            x: juggernaut.x + juggernaut.baseWidth / 2 + (i - bulletCount/2) * 15,
                            y: juggernaut.y + juggernaut.baseHeight,
                            speedX: (i - bulletCount/2) * 0.8,
                            speedY: enemyBulletSpeed + 1
                        });
                    }
                    juggernaut.lastShot = currentTime;
                }
            }
            
            // Update powerups
            const currentTime2 = Date.now();
            if (currentTime2 - lastPowerupTime > powerupInterval) {
                createPowerup();
                lastPowerupTime = currentTime2;
            }
            
            for (let i = powerups.length - 1; i >= 0; i--) {
                powerups[i].y += powerups[i].speedY;
                if (powerups[i].y > canvas.height) {
                    powerups.splice(i, 1);
                }
            }
        }
        
        // Update enemy bullets
        function updateEnemyBullets() {
            for (let i = enemyBullets.length - 1; i >= 0; i--) {
                enemyBullets[i].x += enemyBullets[i].speedX;
                enemyBullets[i].y += enemyBullets[i].speedY;
                
                if (enemyBullets[i].y > canvas.height || 
                    enemyBullets[i].x < 0 || 
                    enemyBullets[i].x > canvas.width) {
                    enemyBullets.splice(i, 1);
                }
            }
        }
        
        // Juggernaut core explosion (when all rings destroyed)
        function explodeJuggernaut() {
            const centerX = juggernaut.x + juggernaut.baseWidth / 2;
            const centerY = juggernaut.y + juggernaut.baseHeight / 2;
            
            // Create massive sunburst of bullets
            for (let angle = 0; angle < Math.PI * 2; angle += Math.PI / 12) {
                enemyBullets.push({
                    x: centerX,
                    y: centerY,
                    speedX: Math.cos(angle) * 5,
                    speedY: Math.sin(angle) * 5
                });
            }
            
            // Add chaotic random bullets
            for (let i = 0; i < 20; i++) {
                const randomAngle = Math.random() * Math.PI * 2;
                enemyBullets.push({
                    x: centerX + (Math.random() - 0.5) * 60,
                    y: centerY + (Math.random() - 0.5) * 60,
                    speedX: Math.cos(randomAngle) * (3 + Math.random() * 4),
                    speedY: Math.sin(randomAngle) * (3 + Math.random() * 4)
                });
            }
            
            juggernaut = null;
            score += 500; // Massive bonus for destroying all rings
            document.getElementById('score').textContent = score;
            
            // Immediately spawn a new juggernaut
            setTimeout(createJuggernaut, 2000);
        }
        
        // Collision detection
        function checkCollisions() {
            // Player bullet-enemy collisions
            for (let i = bullets.length - 1; i >= 0; i--) {
                for (let j = 0; j < enemies.length; j++) {
                    const bullet = bullets[i];
                    const enemy = enemies[j];
                    
                    if (enemy.alive && 
                        bullet.x >= enemy.x && 
                        bullet.x <= enemy.x + enemy.width &&
                        bullet.y >= enemy.y && 
                        bullet.y <= enemy.y + enemy.height) {
                        
                        enemy.health--;
                        bullets.splice(i, 1);
                        
                        if (enemy.health <= 0) {
                            enemy.alive = false;
                            score += enemy.points;
                            document.getElementById('score').textContent = score;
                        }
                        break;
                    }
                }
                
                // Player bullet-juggernaut collisions
                if (juggernaut && juggernaut.alive && bullets[i]) {
                    const bullet = bullets[i];
                    const centerX = juggernaut.x + juggernaut.baseWidth / 2;
                    const centerY = juggernaut.y + juggernaut.baseHeight / 2;
                    const distance = Math.sqrt(
                        Math.pow(bullet.x - centerX, 2) + 
                        Math.pow(bullet.y - centerY, 2)
                    );
                    
                    // Check if bullet hits any ring
                    const outerRingRadius = juggernaut.rings * 15;
                    if (distance <= outerRingRadius) {
                        juggernaut.rings--;
                        bullets.splice(i, 1);
                        score += 50; // Points for each ring destroyed
                        document.getElementById('score').textContent = score;
                        
                        if (juggernaut.rings <= 0) {
                            explodeJuggernaut();
                        }
                    }
                }
            }
            
            // Enemy bullet-player collisions
            for (let i = enemyBullets.length - 1; i >= 0; i--) {
                const bullet = enemyBullets[i];
                const distance = Math.sqrt(
                    Math.pow(bullet.x - player.x, 2) + 
                    Math.pow(bullet.y - player.y, 2)
                );
                
                if (distance < 15) {
                    enemyBullets.splice(i, 1);
                    lives--;
                    document.getElementById('lives').textContent = lives;
                    if (lives <= 0) {
                        gameRunning = false;
                    }
                }
            }
            
            // Powerup-player collisions
            for (let i = powerups.length - 1; i >= 0; i--) {
                const powerup = powerups[i];
                if (powerup.alive) {
                    const distance = Math.sqrt(
                        Math.pow(powerup.x + powerup.width/2 - player.x, 2) + 
                        Math.pow(powerup.y + powerup.height/2 - player.y, 2)
                    );
                    
                    if (distance < 25) {
                        powerups.splice(i, 1);
                        
                        if (powerup.type === 'life') {
                            lives++;
                            document.getElementById('lives').textContent = lives;
                        } else if (powerup.type === 'cannon') {
                            extraCannons = Math.min(extraCannons + 1, 4); // Max 4 extra cannons
                            document.getElementById('cannons').textContent = extraCannons;
                        }
                        
                        score += 25;
                        document.getElementById('score').textContent = score;
                    }
                }
            }
            
            // Check if all enemies are destroyed (but juggernaut always respawns)
            if (enemies.every(enemy => !enemy.alive)) {
                createEnemies();
            }
            
            // Ensure there's always a juggernaut
            if (!juggernaut || !juggernaut.alive) {
                setTimeout(createJuggernaut, 1000);
            }
            
            // Check if enemies reach the player (less likely now with wrapping)
            enemies.forEach(enemy => {
                if (enemy.alive && enemy.y + enemy.height >= player.y - player.height / 2) {
                    const distance = Math.sqrt(
                        Math.pow(enemy.x + enemy.width/2 - player.x, 2) + 
                        Math.pow(enemy.y + enemy.height/2 - player.y, 2)
                    );
                    
                    if (distance < 20) {
                        lives--;
                        document.getElementById('lives').textContent = lives;
                        enemy.alive = false;
                        if (lives <= 0) {
                            gameRunning = false;
                        }
                    }
                }
            });
        }
        
        // Game over screen
        function drawGameOver() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = '#ff0000';
            ctx.font = '48px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2);
            
            ctx.fillStyle = '#ffffff';
            ctx.font = '24px Arial';
            ctx.fillText('Final Score: ' + score, canvas.width / 2, canvas.height / 2 + 50);
            ctx.fillText('Refresh to play again', canvas.width / 2, canvas.height / 2 + 80);
        }
        
        // Main game loop
        function gameLoop() {
            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            if (gameRunning) {
                // Update player position based on mouse
                player.x = mouseX;
                
                // Keep player within bounds
                if (player.x < player.width / 2) player.x = player.width / 2;
                if (player.x > canvas.width - player.width / 2) player.x = canvas.width - player.width / 2;
                
                // Auto-shoot bullets
                const currentTime = Date.now();
                if (currentTime - lastBulletTime > bulletInterval) {
                    createBullet();
                    lastBulletTime = currentTime;
                }
                
                // Update game objects
                updateStars();
                updateBullets();
                updateEnemyBullets();
                updateEnemies();
                checkCollisions();
                
                // Draw everything
                drawStars();
                drawPlayer();
                drawBullets();
                drawEnemyBullets();
                drawEnemies();
                drawJuggernaut();
                drawPowerups();
            } else {
                drawGameOver();
            }
            
            requestAnimationFrame(gameLoop);
        }
        
        // Initialize game
        createEnemies();
        gameLoop();
    </script>
</body>
</html>
