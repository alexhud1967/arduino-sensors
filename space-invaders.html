<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Invaders Clone</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        
        canvas {
            border: 1px solid #333;
            background: #000;
        }
        
        .game-info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="game-info">
        <div>Score: <span id="score">0</span></div>
        <div>Lives: <span id="lives">3</span></div>
    </div>
    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <script>
        // Game setup
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // Game state
        let score = 0;
        let lives = 3;
        let gameRunning = true;
        
        // Mouse position
        let mouseX = canvas.width / 2;
        
        // Stars for background
        const stars = [];
        const numStars = 100;
        
        // Initialize stars
        for (let i = 0; i < numStars; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                speed: Math.random() * 2 + 0.5,
                brightness: Math.random() * 0.8 + 0.2
            });
        }
        
        // Player ship
        const player = {
            x: canvas.width / 2,
            y: canvas.height - 50,
            width: 20,
            height: 20,
            speed: 5
        };
        
        // Bullets
        const bullets = [];
        const bulletSpeed = 7;
        let lastBulletTime = 0;
        const bulletInterval = 150; // milliseconds between bullets
        
        // Enemies
        const enemies = [];
        const enemyRows = 5;
        const enemyCols = 10;
        const enemyWidth = 30;
        const enemyHeight = 20;
        const enemySpeed = 1;
        let enemyDirection = 1;
        
        // Initialize enemies
        function createEnemies() {
            enemies.length = 0;
            for (let row = 0; row < enemyRows; row++) {
                for (let col = 0; col < enemyCols; col++) {
                    enemies.push({
                        x: col * (enemyWidth + 10) + 50,
                        y: row * (enemyHeight + 10) + 50,
                        width: enemyWidth,
                        height: enemyHeight,
                        alive: true
                    });
                }
            }
        }
        
        // Mouse movement
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            mouseX = e.clientX - rect.left;
        });
        
        // Draw triangle ship
        function drawPlayer() {
            ctx.fillStyle = '#00ff00';
            ctx.beginPath();
            ctx.moveTo(player.x, player.y - player.height / 2);
            ctx.lineTo(player.x - player.width / 2, player.y + player.height / 2);
            ctx.lineTo(player.x + player.width / 2, player.y + player.height / 2);
            ctx.closePath();
            ctx.fill();
        }
        
        // Draw stars
        function drawStars() {
            ctx.fillStyle = 'white';
            stars.forEach(star => {
                ctx.globalAlpha = star.brightness;
                ctx.fillRect(star.x, star.y, 1, 1);
            });
            ctx.globalAlpha = 1;
        }
        
        // Update stars
        function updateStars() {
            stars.forEach(star => {
                star.y += star.speed;
                if (star.y > canvas.height) {
                    star.y = 0;
                    star.x = Math.random() * canvas.width;
                }
            });
        }
        
        // Draw bullets
        function drawBullets() {
            ctx.fillStyle = '#ffff00';
            bullets.forEach(bullet => {
                ctx.fillRect(bullet.x - 1, bullet.y - 5, 2, 10);
            });
        }
        
        // Update bullets
        function updateBullets() {
            for (let i = bullets.length - 1; i >= 0; i--) {
                bullets[i].y -= bulletSpeed;
                if (bullets[i].y < 0) {
                    bullets.splice(i, 1);
                }
            }
        }
        
        // Create bullet
        function createBullet() {
            bullets.push({
                x: player.x,
                y: player.y - player.height / 2
            });
        }
        
        // Draw enemies
        function drawEnemies() {
            ctx.fillStyle = '#ff0000';
            enemies.forEach(enemy => {
                if (enemy.alive) {
                    ctx.fillRect(enemy.x, enemy.y, enemy.width, enemy.height);
                }
            });
        }
        
        // Update enemies
        function updateEnemies() {
            let moveDown = false;
            
            // Check if any enemy hits the edge
            enemies.forEach(enemy => {
                if (enemy.alive) {
                    if ((enemy.x <= 0 && enemyDirection === -1) || 
                        (enemy.x + enemy.width >= canvas.width && enemyDirection === 1)) {
                        moveDown = true;
                    }
                }
            });
            
            if (moveDown) {
                enemyDirection *= -1;
                enemies.forEach(enemy => {
                    if (enemy.alive) {
                        enemy.y += 20;
                    }
                });
            }
            
            enemies.forEach(enemy => {
                if (enemy.alive) {
                    enemy.x += enemySpeed * enemyDirection;
                }
            });
        }
        
        // Collision detection
        function checkCollisions() {
            // Bullet-enemy collisions
            for (let i = bullets.length - 1; i >= 0; i--) {
                for (let j = 0; j < enemies.length; j++) {
                    const bullet = bullets[i];
                    const enemy = enemies[j];
                    
                    if (enemy.alive && 
                        bullet.x >= enemy.x && 
                        bullet.x <= enemy.x + enemy.width &&
                        bullet.y >= enemy.y && 
                        bullet.y <= enemy.y + enemy.height) {
                        
                        enemy.alive = false;
                        bullets.splice(i, 1);
                        score += 10;
                        document.getElementById('score').textContent = score;
                        break;
                    }
                }
            }
            
            // Check if all enemies are destroyed
            if (enemies.every(enemy => !enemy.alive)) {
                createEnemies();
            }
            
            // Check if enemies reach the player
            enemies.forEach(enemy => {
                if (enemy.alive && enemy.y + enemy.height >= player.y - player.height / 2) {
                    lives--;
                    document.getElementById('lives').textContent = lives;
                    if (lives <= 0) {
                        gameRunning = false;
                    } else {
                        createEnemies();
                    }
                }
            });
        }
        
        // Game over screen
        function drawGameOver() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = '#ff0000';
            ctx.font = '48px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2);
            
            ctx.fillStyle = '#ffffff';
            ctx.font = '24px Arial';
            ctx.fillText('Final Score: ' + score, canvas.width / 2, canvas.height / 2 + 50);
            ctx.fillText('Refresh to play again', canvas.width / 2, canvas.height / 2 + 80);
        }
        
        // Main game loop
        function gameLoop() {
            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            if (gameRunning) {
                // Update player position based on mouse
                player.x = mouseX;
                
                // Keep player within bounds
                if (player.x < player.width / 2) player.x = player.width / 2;
                if (player.x > canvas.width - player.width / 2) player.x = canvas.width - player.width / 2;
                
                // Auto-shoot bullets
                const currentTime = Date.now();
                if (currentTime - lastBulletTime > bulletInterval) {
                    createBullet();
                    lastBulletTime = currentTime;
                }
                
                // Update game objects
                updateStars();
                updateBullets();
                updateEnemies();
                checkCollisions();
                
                // Draw everything
                drawStars();
                drawPlayer();
                drawBullets();
                drawEnemies();
            } else {
                drawGameOver();
            }
            
            requestAnimationFrame(gameLoop);
        }
        
        // Initialize game
        createEnemies();
        gameLoop();
    </script>
</body>
</html>
